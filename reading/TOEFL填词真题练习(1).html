_ _ _ _ bones, she_ _ _, and foot_ _ _ _ _ _, provide crit_ _ _ _ evidence o_ past orga_ _ _ _ _ and th_ _ _ environments. B_ analyzing su_ _ remnants, paleont_ _ _ _ _ _ _ _ can reconstruct ancient ecosystems and track evolutionary changes over millions of years. This field offers valuable insights into the development and extinction of species. Advanced techniques like radiometric dating and CT scanning allow scientists to determine precise ages of specimens and examine internal structures without damaging delicate fossils.","answers":["Including","shells","footprints","critical","on","organisms","their","by","such","paleontologists"],"category":"综合"},{"id":64,"text":"The Erie Canal, completed in 1825, is a historic waterway in the United States that linked the Atlantic Ocean to the Great Lakes. Its constr_ _ _ _ _ _ was a remar_ _ _ _ _ engineering fe_ _ and pion_ _ _ _ _ many innov_ _ _ _ _ techniques. T_ _ canal signif_ _ _ _ _ _ _ reduced transpo_ _ _ _ _ _ _ costs a_ _ time fr_ _ New York City to the interior of the nation, propelling the city into a major commercial hub. The success of the Erie Canal inspired the building of other canals and infrastructure projects across the United States.","answers":["Construction","remarkable","feat","pioneered","innovative","the","significantly","transportation","and","from"],"category":"综合"},{"id":65,"text":"The study of insect behavior reveals complex survival strategies and social interactions across species. Honeybees, for inst_ _ _ _, perform a disti_ _ _ _ _ _ dance t_ convey spa_ _ _ _ information ab_ _ _ foraging si_ _ _. Ants exem_ _ _ _ _ extraordinary colle_ _ _ _ _ behavior, def_ _ _ _ by cooper_ _ _ _ _ efficiency. By analyzing these patterns, researchers can trace evolutionary pathways and adaptive strategies that support insect resilience across diverse ecosystems. These insights underscore the ecological sophistication embedded within even the smallest of organisms.","answers":["Instance","distinctive","to","spatial","about","sites","exemplify","collective","defined","cooperative"],"category":"综合"},{"id":66,"text":"The evolution of paint as a medium has significantly impacted the development of visual arts. Early art_ _ _ _ used nat_ _ _ _ pigments der_ _ _ _ from mine_ _ _ _, plants, a_ _ animal sou_ _ _ _ to cre_ _ _ their wo_ _ _. Advances i_ chemistry resu_ _ _ _ in the synthesis of vibrant, durable colors, expanding the artist's palette. Techniques such as oil painting allowed for greater detail and expression. The introduction of acrylic paints offered versatility and fast drying times. Modern painters continue to explore innovative materials and methods, pushing the boundaries of artistic creation. Understanding the history of paint enriches appreciation for the diversity and complexity of artistic practices.","answers":["Artists","natural","derived","minerals","and","sources","create","works","in","resulted"],"category":"综合"},{"id":67,"text":"The advancement of 3-D printing technology has revolutionized manufacturing by enabling precise, layer-by-layer fabrication of complex objects. 3-D printing can use div_ _ _ _ materials su_ _ as plas_ _ _ _, metals, a_ _ ceramics. Engi_ _ _ _ _ are ab_ _ to fabr_ _ _ _ _ lightweight, str_ _ _ components wi_ _ internal struc_ _ _ _ _ that are impossible to produce using traditional methods. In the medical field, 3-D printing facilitates the production of patient-specific implants and prosthetics tailored to anatomical data from imaging scans. 3-D printing enhances design flexibility and production efficiency by streamlining prototyping and reducing material waste.","answers":["Diverse","such","plastics","and","engineers","able","fabricate","strong","with","structure"],"category":"综合"},{"id":68,"text":"The Renaissance was a period of cultural rebirth in Europe, spanning the fourteenth to seventeenth centuries. A vib_ _ _ _ period o_ cultural, arti_ _ _ _, and intell_ _ _ _ _ _ revival, t_ _ Renaissance mar_ _ _ a ren_ _ _ _ interest i_ classical liter_ _ _ _ _, art, a_ _ science. The Renaissance had a profound historical impact, serving as a bridge between the Middle Ages and the modern era. It sparked a cultural awakening that emphasized humanism, individual achievement, and secular learning, which reshaped European thought and institutions.","answers":["Vibrant","on","artistic","intellectual","the","marked","renewed","in","literature","and"],"category":"综合"},{"id":69,"text":"Plants have evolved various structures to optimize photosynthesis (the capture and conversion of light energy) and survival. Roots anc_ _ _ the plant a_ _ absorb wa_ _ _ and mine_ _ _ _ from t_ _ soil. Leaves a_ _ the pri_ _ _ _ sites o_ photosynthesis. Their br_ _ _, flat surf_ _ _ _ maximize light absorption. The stem supports the leaves and transports nutrients and water through the vascular system, which consists of xylem and phloem. Some plants, like succulents, store water in their thick leaves to endure arid conditions.","answers":["Anchor","and","water","minerals","the","are","primary","on","broad","surfaces"],"category":"综合"},{"id":70,"text":"The Middle Ages was a period in Europe that spanned roughly between the fifth and fifteenth centuries. This e_ _ saw signi_ _ _ _ _ _ changes, mo_ _ notably t_ _ spread o_ Christianity a_ _ the establ_ _ _ _ _ _ _ of powe_ _ _ _ kingdoms. Des_ _ _ _ being of_ _ _ referred to as the \"Dark Ages,\" a name that suggests stagnation and decline, this period also witnessed remarkable achievements in art, architecture, and learning, laying the groundwork for Europe's transition into the Renaissance and the age of discovery.","answers":["Era","significant","most","the","of","and","establishment","powerful","despite","often"],"category":"综合"},{"id":71,"text":"The presence of water and volcanic activity on other planets is central to the search for extraterrestrial life. Water is a key ingredient for life as we know it, and its discovery on Mars and moons like Europa and Enceladus raises intriguing possibilities. Volc_ _ _ _ activity prov_ _ _ _ heat a_ _ nutrients th_ _ could sup_ _ _ _ microbial li_ _. Missions equi_ _ _ _ with adva_ _ _ _ instruments col_ _ _ _ and exa_ _ _ _ surface and atmospheric samples to detect signs of liquid water and geothermal activity. Discoveries of liquid water and geothermal energy are pivotal in assessing the habitability of extraterrestrial environments.","answers":["Volcanic","provide","and","that","support","life","equipped","advanced","collect","examine"],"category":"综合"},{"id":72,"text":"Understanding the relationship between cognition and consciousness is pivotal for unraveling the complexities of human thinking and behavior, as both are fundamental activities of the brain. Cognition is the men_ _ _ process b_ which indiv_ _ _ _ _ _ acquire know_ _ _ _ _ and unders_ _ _ _ _ _ _ through tho_ _ _ _, experience, a_ _ the sen_ _ _. Consciousness ref_ _ _ to t_ _ state of being aware of and responsive to one's surroundings. The advancements of neuroimaging technologies have provided insights into how consciousness arises from neural networks and how cognitive processes can occur both with and without conscious awareness.","answers":["Mental","by","individuals","knowledge","understanding","thought","and","senses","refers","the"],"category":"综合"},{"id":73,"text":"Environmental scientists examine how coastal marshes store carbon within waterlogged sediments. This pro_ _ _ _ is cru_ _ _ _ for cli_ _ _ _ regulation bec_ _ _ _ vegetation tr_ _ _ sediment bet_ _ _ _ stems wh_ _ _ waterlogged condi_ _ _ _ _ slow micr_ _ _ _ _ decay. Do_ _ this storage depend mainly on plant growth or sediment accumulation? Do marshes release stored carbon when drained, and can they recover after tidal flow is restored? Such questions inform broader debates about ecosystem management and the role of natural habitats in slowing atmospheric warming.","answers":["Process","crucial","climate","because","traps","between","while","conditions","microbial","does"],"category":"综合"},{"id":74,"text":"Climate change is a long-term alteration in average temperatures and weather patterns across Earth’s regions. Researchers docu_ _ _ _ warming oce_ _ _, retreating glac_ _ _ _, shifting rain_ _ _ _, intensifying sto_ _ _, prolonged drou_ _ _ _, coastal floo_ _ _ _, damaged re_ _ _, and disr_ _ _ _ _ harvests worl_ _ _ _ _. Although some climate variations occur naturally, the rapid warming observed since the industrial era is mainly caused by human emissions of heat-trapping gases. Reducing these emissions and adapting infrastructure can limit future harm to ecosystems and communities.","answers":["Document","oceans","glaciers","rainfall","storms","droughts","flooding","reefs","disruptive","worldwide"],"category":"综合"},{"id":75,"text":"Seed banks act as biological archives, collecting and storing seeds from crops and wild plants around the world. They main_ _ _ _ genetic reso_ _ _ _ _ that he_ _ scientists pres_ _ _ _ rare spe_ _ _ _, restore ecosy_ _ _ _ _, and imp_ _ _ _ crops. Sam_ _ _ _ are cata_ _ _ _ _ to ens_ _ _ their origins and traits can be traced. Seed banks also play a critical role in conservation, using low temperatures and dry conditions to keep seeds viable for decades. They strengthen food security and give future researchers access to plant diversity that may prove essential as climates and agricultural needs change.","answers":["Maintain","resources","help","preserve","species","ecosystems","improve","samples","cataloged","ensure"],"category":"综合"},{"id":76,"text":"The Aeneid is a Roman epic poem that follows the Trojan warrior Aeneas as he searches for a new homeland after the destruction of Troy. It cont_ _ _ _ _ to be rega_ _ _ _ as o_ _ of t_ _ most influ_ _ _ _ _ _ poems i_ Latin lite_ _ _ _ history. Th_ _ work comb_ _ _ _ enduring narr_ _ _ _ _ patterns with political symbolism, influencing later European storytelling. It also examines the conflict between personal desire and public duty. Aeneas repeatedly sacrifices private happiness to fulfill a larger mission, illustrating how loyalty, loss, and political responsibility can transform an individual's sense of identity.","answers":["Continues","regarded","one","the","influential","in","literary","this","combines","narrative"],"category":"综合"},{"id":77,"text":"What abilities help students complete group research successfully? Clear commun_ _ _ _ _ _ _ enables mem_ _ _ _ to coord_ _ _ _ _ tasks effic_ _ _ _ _ _, identify prob_ _ _ _, and ma_ _ decisions un_ _ _ pressure. Al_ _ valuable a_ _ practical ski_ _ _ like planning and conflict resolution. Planning helps a team divide responsibilities, establish realistic deadlines, and use available resources wisely. Conflict resolution supports group performance because students who address disagreements respectfully can preserve trust, consider different perspectives, and keep everyone focused on shared goals.","answers":["Communication","members","coordinate","efficiently","problems","make","under","Also","are","skills"],"category":"综合"}];
var currentIdx = -1;
var submitted = false;
var scores = {};
var stats = { done: 0, correct: 0, total: 0 };
var activeFilter = 'all';

var catColors = {
  '乌鸦':'#6B7280','人文':'#8B5CF6','生物':'#10B981','历史':'#F59E0B',
  '心理':'#EC4899','气候':'#3B82F6','考古':'#A855F7','艺术':'#EF4444',
  '地质':'#78716C','综合':'#6366f1'
};
var catEmojis = {
  '乌鸦':'🐦','人文':'📚','生物':'🧬','历史':'🏛️',
  '心理':'🧠','气候':'🌍','考古':'⛏️','艺术':'🎨',
  '地质':'🪨','综合':'📌'
};

function getCategories() {
  var cats = {};
  PASSAGES.forEach(function(p) { cats[p.category] = (cats[p.category]||0) + 1; });
  return Object.keys(cats).sort(function(a,b){ return cats[b]-cats[a]; });
}

function renderFilters() {
  var cats = getCategories();
  var el = document.getElementById('filter-bar');
  var html = '<span class="filter-label">筛选：</span>';
  html += '<button class="f-btn active" onclick="setFilter(\'all\',this)">全部('+PASSAGES.length+')</button>';
  cats.forEach(function(c) {
    var cnt = PASSAGES.filter(function(p){return p.category===c;}).length;
    html += '<button class="f-btn" onclick="setFilter(\''+c+'\',this)">'+(catEmojis[c]||'📌')+' '+c+'('+cnt+')</button>';
  });
  el.innerHTML = html;
}

function setFilter(cat, btn) {
  activeFilter = cat;
  document.querySelectorAll('.f-btn').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active');
  renderList();
}

function renderList() {
  var el = document.getElementById('passage-list');
  var html = '';
  PASSAGES.forEach(function(p, i) {
    if (activeFilter !== 'all' && p.category !== activeFilter) return;
    var preview = p.text.replace(/([a-zA-Z]{1,20})((_ +_?)+)/g, '___').substring(0, 100) + '...';
    var done = scores[i] !== undefined;
    var cls = done ? 'done' : '';
    var color = catColors[p.category] || '#6366f1';
    var emoji = catEmojis[p.category] || '📌';
    var scoreHTML = '';
    if (done) {
      var s = scores[i];
      var pct = Math.round(s.correct / s.total * 100);
      var sc = pct >= 80 ? 'good' : pct >= 50 ? 'mid' : 'low';
      scoreHTML = '<span class="score-tag '+sc+'">'+pct+'%</span>';
    }
    html += '<div class="passage-item '+cls+'" onclick="openPassage('+i+')">' +
      '<div class="passage-num">'+(i+1)+'</div>' +
      '<div class="passage-info">' +
        '<div class="passage-preview">'+escapeHTML(preview)+'</div>' +
        '<div class="passage-meta">' +
          '<span class="cat-tag" style="background:'+color+'">'+emoji+' '+p.category+'</span>' +
          '<span class="blank-tag">'+p.answers.length+'空</span>' +
          scoreHTML +
        '</div>' +
      '</div></div>';
  });
  if (!html) html = '<div class="empty-state"><div class="emoji">🔍</div><p>该分类暂无题目</p></div>';
  el.innerHTML = html;
}

function escapeHTML(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// Render passage: find each blank, use answer length to determine required letters
function renderPassageText(passage) {
  var blankIdx = 0;
  var answers = passage.answers;
  var text = passage.text;
  // Pass 1: replace blank patterns (prefix + underscores)
  var result = text.replace(/([a-zA-Z]{1,20})((_+ ?)+_?)/g, function(match, prefix) {
    if (blankIdx >= answers.length) return match;
    var requiredLen = answers[blankIdx].length;
    var prefixLen = prefix.length;
    var needMore = requiredLen - prefixLen;
    blankIdx++;
    if (needMore <= 0) needMore = 1;
    return '<span class="blank-group"><span class="blank-prefix">' + prefix + '</span>' +
      '<input type="text" class="blank-input" data-i="' + blankIdx +
      '" placeholder="' + needMore + '个字母" maxlength="' + needMore + '" autocomplete="off" spellcheck="false"></span>';
  });
  // Pass 2: remove any remaining stray underscores/spaces from blanks
  // Simple approach: iterate through chars, skip _ and space between tags
  var out = '';
  var i = 0;
  while (i < result.length) {
    // Check if we're at </span>
    if (result.substring(i, i + 7) === '</span>') {
      out += '</span>';
      i += 7;
      // Skip any following underscores and spaces
      while (i < result.length && (result[i] === '_' || result[i] === ' ')) i++;
    }
    // Check if we're at underscores before <span class="blank-group">
    else if (result[i] === '_' || result[i] === ' ') {
      // Look ahead: is this followed by underscores/spaces then <span class="blank-group">?
      var j = i;
      while (j < result.length && (result[j] === '_' || result[j] === ' ')) j++;
      if (result.substring(j, j + 25) === '<span class="blank-group">') {
        i = j; // skip the underscores, keep the span
      } else {
        out += result[i];
        i++;
      }
    }
    else {
      out += result[i];
      i++;
    }
  }
  result = out;
  return result;
}

function openPassage(i) {
  currentIdx = i;
  submitted = false;
  var p = PASSAGES[i];
  document.getElementById('list-view').classList.add('hidden');
  var pv = document.getElementById('practice-view');
  pv.classList.add('show');
  document.getElementById('nav-info').textContent = '第 '+i+' / '+PASSAGES.length+' 篇';
  document.getElementById('passage-title').textContent = 'Passage '+(i+1)+' / '+PASSAGES.length;
  var color = catColors[p.category]||'#6366f1';
  var emoji = catEmojis[p.category]||'📌';
  document.getElementById('cat-badge').style.background = color;
  document.getElementById('cat-badge').textContent = emoji+' '+p.category+' · '+p.answers.length+'空';
  document.getElementById('passage-body').innerHTML = renderPassageText(p);
  document.getElementById('result-panel').classList.remove('show');
  document.getElementById('result-panel').innerHTML = '';
  document.getElementById('btn-prev').disabled = (i === 0);
  document.getElementById('btn-next').disabled = (i === PASSAGES.length - 1);
  document.querySelectorAll('.blank-input').forEach(function(inp) {
    inp.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        var arr = Array.from(document.querySelectorAll('.blank-input'));
        var idx2 = arr.indexOf(this);
        if (idx2 < arr.length-1) arr[idx2+1].focus();
        else submitAll();
      }
    });
  });
  window.scrollTo({top: 0, behavior: 'smooth'});
}

function reselect() {
  submitted = false;
  currentIdx = -1;
  document.getElementById('practice-view').classList.remove('show');
  document.getElementById('list-view').classList.remove('hidden');
  renderList();
}

function goPrev() { if (currentIdx > 0) openPassage(currentIdx - 1); }
function goNext() { if (currentIdx < PASSAGES.length - 1) openPassage(currentIdx + 1); }

function submitAll() {
  if (currentIdx < 0 || submitted) return;
  submitted = true;
  var answers = PASSAGES[currentIdx].answers;
  var inputs = document.querySelectorAll('.blank-input');
  var correct = 0;
  var results = [];
  // Re-parse to get prefix for each blank
  var blankIdx = 0;
  var prefixes = [];
  PASSAGES[currentIdx].text.replace(/([a-zA-Z]{1,20})((_ +_?)+)/g, function(match, prefix) {
    prefixes.push(prefix);
  });
  inputs.forEach(function(inp, i) {
    var ua = inp.value.trim().toLowerCase();
    var fullAns = (answers[i]||'').trim();
    var prefix = prefixes[i] || '';
    var suffix = fullAns.substring(prefix.length).toLowerCase();
    var ok = ua === suffix;
    if (ok) { inp.classList.add('correct'); correct++; }
    else { inp.classList.add('incorrect'); }
    inp.disabled = true;
    results.push({ user: prefix + (inp.value.trim()||'(未填)'), ans: fullAns, ok: ok });
  });
  var total = answers.length;
  var pct = Math.round(correct/total*100);
  if (scores[currentIdx] === undefined) stats.done++;
  else { stats.correct -= scores[currentIdx].correct; stats.total -= scores[currentIdx].total; }
  stats.correct += correct;
  stats.total += total;
  scores[currentIdx] = { correct: correct, total: total, pct: pct };
  updateStatsUI();
  var sc='excellent',se='🎉',st='完美！';
  if(pct<100){sc='good';se='👍';st='不错！';}
  if(pct<70){sc='fair';se='💪';st='继续加油！';}
  if(pct<50){sc='poor';se='📖';st='需要复习';}
  var aHTML='<div class="answer-list">';
  results.forEach(function(r,i){
    var cls=r.ok?'was-correct':'was-wrong';
    var ic=r.ok?'✓':'✗';
    aHTML+='<span class="answer-item '+cls+'"><span>'+ic+'</span>'+(i+1)+'. '+r.user+' → <strong>'+r.ans+'</strong></span>';
  });
  aHTML+='</div>';
  var panel=document.getElementById('result-panel');
  panel.innerHTML='<div class="score-bar '+sc+'">'+se+' '+st+' 答对 '+correct+'/'+total+'（'+pct+'%）</div>'+aHTML;
  panel.classList.add('show');
  panel.scrollIntoView({behavior:'smooth',block:'nearest'});
}

function showAllAnswers() {
  if (currentIdx<0) return;
  submitted=true;
  var answers=PASSAGES[currentIdx].answers;
  // Re-parse to get prefixes
  var prefixes=[];
  PASSAGES[currentIdx].text.replace(/([a-zA-Z]{1,20})((_ +_?)+)/g, function(m,p){prefixes.push(p);});
  document.querySelectorAll('.blank-input').forEach(function(inp,i){
    var fullAns=answers[i]||'';
    var suffix=fullAns.substring((prefixes[i]||'').length);
    inp.value=suffix;
    inp.classList.add('correct');
    inp.disabled=true;
  });
  var panel=document.getElementById('result-panel');
  panel.innerHTML='<div class="score-bar good">👁️ 已显示所有正确答案</div>';
  panel.classList.add('show');
}

function updateStatsUI() {
  document.getElementById('stat-done').textContent=stats.done;
  document.getElementById('stat-correct').textContent=stats.correct;
  document.getElementById('stat-acc').textContent=stats.total>0?Math.round(stats.correct/stats.total*100)+'%':'-';
}

renderFilters();
renderList();
</script>
